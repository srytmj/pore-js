server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # correct types for pdf.js wasm + the PWA manifest
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # hashed build assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # generated fixtures — cache a little, they're content-addressed by folder
    location /fixtures/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # never cache the shell or the service worker
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
