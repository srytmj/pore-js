name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:fixtures
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - run: node scripts/verify-packages.mjs

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the real-book corpus
        uses: actions/cache@v4
        with:
          path: test/corpus/files
          key: corpus-${{ hashFiles('test/corpus/sources.json') }}
      - run: node scripts/fetch-corpus.mjs
      - run: pnpm build
      - run: pnpm test:corpus

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the demo image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:fixtures
      - run: pnpm --filter @pore/demo exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @pore/demo e2e --project=${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: pnpm --filter @pore/example-host-app e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/demo/playwright-report/
          retention-days: 7
