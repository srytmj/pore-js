name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:fixtures
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/verify-packages.mjs

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the real-book corpus
        uses: actions/cache@v4
        with:
          path: test/corpus/files
          key: corpus-${{ hashFiles('test/corpus/sources.json') }}
      - run: node scripts/fetch-corpus.mjs
      - run: pnpm build
      - run: pnpm test:corpus

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:fixtures
      - run: pnpm --filter @pore/demo exec playwright install --with-deps chromium
      - run: pnpm --filter @pore/demo e2e
      - run: pnpm --filter @pore/example-host-app e2e
