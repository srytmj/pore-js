name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version-bump commit + git tags
  pull-requests: write # open / update the "Version Packages" PR
  id-token: write # npm provenance (OIDC)
  packages: write # push the demo image to GHCR

jobs:
  release:
    # dormant until the owner sets repo variable RELEASE_ENABLED=true and adds
    # the NPM_TOKEN secret (or configures npm Trusted Publishing). See
    # docs/releasing.md.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:fixtures
      - run: pnpm build

      # While changesets are pending: opens/updates a "Version Packages" PR.
      # When that PR merges (versions bumped, no changesets left): runs
      # `pnpm release` → build + verify-packages + `changeset publish`.
      # npm provenance comes from `publishConfig.provenance` in each package +
      # the `id-token: write` permission above.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Only when a real publish happened: build + push the demo image so the
      # homelab can pull it (see docs/deploy.md).
      - name: Log in to GHCR
        if: steps.changesets.outputs.published == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push the demo image
        if: steps.changesets.outputs.published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/demo/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/porejs-demo:latest
            ghcr.io/${{ github.repository_owner }}/porejs-demo:${{ github.sha }}
